on: [push, pull_request]
name: CI
jobs:
  CI:
    runs-on: ubuntu-latest
    # The app requires Ruby ~> 4.0, which the ruby/setup-ruby action does not
    # provide on GitHub-hosted runners (max 3.5). Run inside the official
    # ruby:4.0 image instead.
    container:
      image: ruby:4.0
    env:
      SHOPIFY_API_KEY: test-api-key
      SHOPIFY_API_SECRET: test-secret-key
      SCOPES: write_products
      HOST: app-host-name.io
      BUNDLE_GEMFILE: ${{ github.workspace }}/web/Gemfile
      RAILS_ENV: test
      # Container jobs reach service containers by their label, not localhost.
      POSTGRES_HOST: postgres
      POSTGRES_USER: rupert
      POSTGRES_PASSWORD: rupert
      POSTGRES_DB: rupert_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rupert
          POSTGRES_PASSWORD: rupert
          POSTGRES_DB: rupert_test
        options: >-
          --health-cmd "pg_isready -U rupert"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive

      - name: Find any lock file
        run: if test -f ../yarn.lock || test -f ../pnpm-lock.yaml || test -f ../package-lock.json; then echo "Please don't commit lock files" && exit 1; fi

      - name: Install dependencies
        run: bundle install

      - name: Run RuboCop
        run: bundle exec rubocop --parallel -c ./rubocop.yml

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Precompile assets
        run: bin/rails assets:precompile

      - name: Run tests
        run: bin/rails test
