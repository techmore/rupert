on:
  push:
    branches: [main]
  pull_request:
name: CI
permissions:
  contents: read
concurrency:
  # main runs are keyed by commit so each integrated SHA keeps its own result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Only superseded PR runs are cancelled; a cancelled main run would block deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  product_site:
    name: Product site consistency
    runs-on: ubuntu-latest
    # Typically about 1 minute.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Whitespace errors (trailing spaces, blank lines at EOF)
        run: git diff-tree --check "$(git hash-object -t tree /dev/null)" HEAD -- . ':(exclude)docs/audits/data' ':(exclude)*.txt' ':(exclude)*.csv'
      - run: python3 bin/build-product-site --check
      - run: python3 bin/check-doc-links
      # shellcheck is preinstalled on ubuntu-latest. Accepted findings are
      # disabled inline with a reason next to the line.
      - name: Shellcheck deploy and app shell scripts
        run: shellcheck deploy/ser8/*.sh web/bin/dev web/bin/prepare-sqlite
      # age encrypts backups (#421); the encrypted-backup script tests use the real CLI.
      - name: Install age
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq age
      - run: python3 -m unittest discover -s deploy/ser8/tests -v
      # Release audit, static part (docs/ops/release-audit.md): card numbers in the repo, customer
      # names and email evidence on public pages (hashed deny-list secret), unproven certification
      # claims, draft legal pages. Known findings in the hashed baseline warn instead of failing.
      - run: python3 -m unittest discover -s bin/tests -v
      - name: Release audit (card data, public privacy, claims, legal)
        env:
          RUPERT_PRIVACY_DENYLIST: ${{ secrets.RUPERT_PRIVACY_DENYLIST }}
        run: |
          status=0
          python3 bin/release-audit --baseline .github/release-audit-baseline.json --report release-audit.md > /dev/null || status=$?
          cat release-audit.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Run all browser-controller tests
        run: node --test web/test/javascript/*_test.mjs web/engines/*/test/javascript/*_test.mjs
  # The Rails suite runs as three shards at once (bin/test-shard), beside a
  # job for lint, migration checks and module tests. "CI (sqlite3)" then
  # merges the shards' coverage and passes only if every job above passed.
  checks:
    name: CI checks
    runs-on: ubuntu-latest
    # Typically 2 minutes.
    timeout-minutes: 15
    # The app requires Ruby ~> 4.0, which the ruby/setup-ruby action does not
    # provide on GitHub-hosted runners (max 3.5). Run inside the official
    # ruby:4.0 image instead.
    container:
      image: ruby:4.0.9
    env:
      SHOPIFY_API_KEY: test-api-key
      SHOPIFY_API_SECRET: test-secret-key
      SCOPES: write_products
      HOST: app-host-name.io
      BUNDLE_GEMFILE: ${{ github.workspace }}/web/Gemfile
      # Relative to web/ (every run step's working directory); cached below.
      BUNDLE_PATH: vendor/bundle
      RAILS_ENV: test
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      # Keyed on the lockfile and the container's Ruby (keep in step with
      # container.image above); a partial hit still saves most of the install.
      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/vendor/bundle
          key: gems-${{ runner.os }}-ruby-4.0.9-${{ hashFiles('web/Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-ruby-4.0.9-

      - name: Install dependencies
        run: bundle install && bundle clean

      # The backup-key tests check generated keys against the real age CLI (#421).
      - name: Install age
        run: apt-get -o Acquire::Retries=5 update -qq && apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends age

      - name: Prepare test database
        run: bin/rails db:prepare

      # Also builds the Tailwind CSS (tailwindcss-rails enhances assets:precompile).
      - name: Precompile assets
        run: bin/rails assets:precompile

      - name: Verify patched DNS resolver in Ruby runtime
        run: |
          ruby <<'RUBY'
          require "resolv"
          version = Gem.loaded_specs.fetch("resolv").version
          abort "resolv #{version} is below 0.7.2" if version < Gem::Version.new("0.7.2")
          puts "resolv #{version}"
          RUBY

      - name: Run RuboCop
        run: bundle exec rubocop --parallel -c ./rubocop.yml

      - name: Verify palette contrast (light and dark tokens, WCAG AA)
        run: bin/check-palette-contrast

      - name: Verify every test file is in exactly one shard
        run: bin/test-shard --check 3

      - name: Verify all migrations on a fresh isolated SQLite database
        run: bin/rails runner test/support/verify_fresh_sqlite_migrations.rb

      - name: Verify warehouse hold migration and legacy backfill
        run: bin/rails runner test/support/verify_warehouse_hold_migration.rb

      - name: Verify bank mapping migration and preserved evidence
        run: bin/rails runner test/support/verify_bank_mapping_migration.rb

      # Named separately so a release-audit failure is obvious: card data never reaches logs, chat or AI prompts.
      - name: Card data redaction tests
        run: bin/rails test test/services/card_data_test.rb test/integration/card_data_logging_test.rb

      # Optional modules (web/engines/*) are off in the main suite; each one's own
      # tests run here with it turned on, in a separate process.
      - name: Run the optional Buzz module's tests (module on)
        run: RUPERT_BUZZ_ENABLED=1 bin/rails test engines/buzz/test

  tests:
    name: CI tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Typically 3 minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: ruby:4.0.9
    env:
      SHOPIFY_API_KEY: test-api-key
      SHOPIFY_API_SECRET: test-secret-key
      SCOPES: write_products
      HOST: app-host-name.io
      BUNDLE_GEMFILE: ${{ github.workspace }}/web/Gemfile
      # Relative to web/ (every run step's working directory); cached below.
      BUNDLE_PATH: vendor/bundle
      RAILS_ENV: test
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      # Keyed on the lockfile and the container's Ruby (keep in step with
      # container.image above); a partial hit still saves most of the install.
      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/vendor/bundle
          key: gems-${{ runner.os }}-ruby-4.0.9-${{ hashFiles('web/Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-ruby-4.0.9-

      - name: Install dependencies
        run: bundle install && bundle clean

      # The backup-key tests check generated keys against the real age CLI (#421).
      - name: Install age
        run: apt-get -o Acquire::Retries=5 update -qq && apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends age

      - name: Prepare test database
        run: bin/rails db:prepare

      # Also builds the Tailwind CSS (tailwindcss-rails enhances assets:precompile).
      - name: Precompile assets
        run: bin/rails assets:precompile

      - name: Run tests (with coverage)
        run: COVERAGE=1 bin/rails test $(bin/test-shard ${{ matrix.shard }} 3)

      - name: Upload shard coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: web/coverage/.resultset.json
          include-hidden-files: true
          retention-days: 3

  CI:
    # The job name is a required status check and is read by
    # deploy/ser8/rupert-autodeploy.sh; keep it in sync with both.
    name: CI (sqlite3)
    needs: [checks, tests]
    # Always runs, so a failed or skipped job above fails this check instead
    # of leaving it skipped (a skipped required check would let a PR merge).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same image and workspace path as the shards, so coverage file paths match.
    container:
      image: ruby:4.0.9
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Every CI job passed
        working-directory: /
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "checks=$CHECKS tests=$TESTS"
          [ "$CHECKS" = success ] && [ "$TESTS" = success ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download shard coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-shard-*
          path: web/coverage-shards

      - name: Merge shard coverage
        run: bin/merge-coverage-shards coverage-shards 3

      - name: Enforce coverage floors on the sync engine and money paths
        run: bin/check-coverage --report

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-sqlite3
          path: web/coverage
          include-hidden-files: true
          retention-days: 14
