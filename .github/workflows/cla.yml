name: Contributor License Agreement (CLA)

on:
  pull_request_target:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

# The CLA action checks signatures against Shopify's service (cla-token), then
# comments, labels and sets a commit status; nothing is stored in this repo.
permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLA_TOKEN: ${{ secrets.CLA_TOKEN }}
    if: |
      (github.event.issue.pull_request
        && !github.event.issue.pull_request.merged_at
        && contains(github.event.comment.body, 'signed')
      )
      || (github.event.pull_request && !github.event.pull_request.merged)
    steps:
      - name: Check contributor license agreement
        if: env.CLA_TOKEN != ''
        uses: Shopify/shopify-cla-action@1af529ae29b29b6083963ff22425ea64749261bc # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cla-token: ${{ secrets.CLA_TOKEN }}
