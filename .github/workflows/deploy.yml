name: Deploy to Droplet (systemd)

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Deploy via git + systemd
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            export PATH=/root/.rbenv/shims:/root/.rbenv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            cd /root/rupert
            git pull --ff-only origin main
            chown -R rupert:rupert web
            cd web
            bundle install --quiet
            bin/rails tailwindcss:build
            RAILS_ENV=production bin/rails assets:precompile
            RAILS_ENV=production bin/rails db:migrate
            systemctl restart rupert-web rupert-jobs
            echo "deploy complete"
