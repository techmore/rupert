name: Deploy to Droplet (systemd)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via git + systemd
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            export PATH=/root/.rbenv/shims:/root/.rbenv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            cd /root/rupert
            git pull --ff-only origin main
            chown -R rupert:rupert web
            cd web
            bundle install --quiet
            bin/rails tailwindcss:build
            RAILS_ENV=production bin/rails assets:precompile
            RAILS_ENV=production bin/rails db:migrate
            systemctl restart rupert-web rupert-jobs
            echo "deploy complete"
