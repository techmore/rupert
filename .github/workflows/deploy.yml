name: Deploy to Droplet

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/techmore/rupert:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/rupert
            cd /opt/rupert
            curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/techmore/rupert/main/docker-compose.yml
            [ -f .env ] || echo "NOTE: create /opt/rupert/.env (see .env.example) before first deploy" >&2
            docker compose pull web jobs || true
            docker compose up -d --remove-orphans
            docker image prune -f
