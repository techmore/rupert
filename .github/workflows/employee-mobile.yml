name: Employee mobile
on:
  # Feature-branch pushes are covered by the pull_request run for the same head.
  # main pushes stay: the updater needs an exact-SHA `validate` result on main.
  push:
    branches: [main]
    paths: ['mobile/**', 'bin/check-mobile-sdk.mjs', '.github/workflows/employee-mobile.yml']
  pull_request:
    paths: ['mobile/**', 'bin/check-mobile-sdk.mjs', '.github/workflows/employee-mobile.yml']
permissions:
  contents: read
concurrency:
  # main runs are keyed by commit so a queued main run is never replaced.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Only superseded PR runs are cancelled; a cancelled main run would block deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Validate SDK compatibility, security backports, audit and employee boundaries
        run: |
          node ../bin/check-mobile-sdk.mjs --self-test
          node ../bin/check-mobile-sdk.mjs
          npm run verify:security
          npm run typecheck
          npm test
          npm run audit:security
      - name: Validate Expo app configuration
        # SDK compatibility is checked against the installed manifest above.
        # Doctor's remote latest-patch recommendation is not a locked-build test.
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
        run: npx --yes expo-doctor@1.21.4
      - name: Export both native platforms with Hermes
        run: npm run export
      - name: Retain unsigned JavaScript export verification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: employee-native-js-exports-${{ github.sha }}
          path: mobile/dist/
          if-no-files-found: error
          retention-days: 14
