name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  # PR runs share a group per PR; main and scheduled runs are keyed by event and commit.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  # Only superseded PR runs are cancelled; a cancelled main run would block deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scan:
    name: Dependency and static scan
    runs-on: ubuntu-latest
    # Typically 1-2 minutes.
    timeout-minutes: 10
    container:
      image: ruby:4.0.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install scanners
        run: gem install --no-document brakeman:8.1.0 bundler-audit:0.9.3
      - name: Audit gems for known vulnerabilities
        run: bundler-audit check --update --gemfile-lock web/Gemfile.lock
      - name: Brakeman static analysis (fails on warnings not in the baseline)
        run: brakeman --path web --no-pager --quiet --confidence-level 2 --compare web/config/brakeman-baseline.json
      # Secrets in new commits (docs/ops/release-audit.md). Pull requests scan their own commits and
      # pushes to main scan what they added, so existing history never blocks a deploy; release tags
      # scan the whole tree in release.yml. Findings are redacted in the log.
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - name: Secret scan of new commits (gitleaks)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit for this event; scanning the latest commit only."
            BASE="$HEAD~1"
          fi
          gitleaks git --redact --no-banner --log-opts="$BASE..$HEAD" .
