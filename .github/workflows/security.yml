name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  # PR runs share a group per PR; main and scheduled runs are keyed by event and commit.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  # Only superseded PR runs are cancelled; a cancelled main run would block deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scan:
    name: Dependency and static scan
    runs-on: ubuntu-latest
    container:
      image: ruby:4.0.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install scanners
        run: gem install --no-document brakeman:8.1.0 bundler-audit:0.9.3
      - name: Audit gems for known vulnerabilities
        run: bundler-audit check --update --gemfile-lock web/Gemfile.lock
      - name: Brakeman static analysis (fails on warnings not in the baseline)
        run: brakeman --path web --no-pager --quiet --confidence-level 2 --compare web/config/brakeman-baseline.json
