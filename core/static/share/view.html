<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch a shared screen</title><link rel="stylesheet" href="/share.css"></head>
<body><main>
<h1>Watch a shared screen</h1>
<p class="mut">View only. You cannot control the other computer, and they can see that you are watching and remove you at any time.</p>
<div id="vstat" role="status">Connecting…</div>
<video id="video" autoplay playsinline muted hidden></video>
<p><button id="leave" hidden>Leave</button></p>
</main><script src="/v.js"></script></body></html>
