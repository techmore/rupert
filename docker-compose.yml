services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: rupert_production
      POSTGRES_USER: rupert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rupert}
    volumes:
      - rupert-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rupert"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - rupert-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/techmore/rupert:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      POSTGRES_HOST: db
      POSTGRES_USER: rupert
      POSTGRES_DB: rupert_production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rupert}
      REDIS_URL: redis://redis:6379/1
    volumes:
      - rupert-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  jobs:
    image: ghcr.io/techmore/rupert:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      POSTGRES_HOST: db
      POSTGRES_USER: rupert
      POSTGRES_DB: rupert_production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rupert}
      REDIS_URL: redis://redis:6379/1
    volumes:
      - rupert-storage:/app/storage
    command: ["bin/jobs"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  rupert-pg:
  rupert-redis:
  rupert-storage:
