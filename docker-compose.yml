services:
  web:
    image: ghcr.io/techmore/rupert:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
    volumes:
      - rupert-db:/app/db
      - rupert-storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  jobs:
    image: ghcr.io/techmore/rupert:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
    volumes:
      - rupert-db:/app/db
      - rupert-storage:/app/storage
    command: ["bin/jobs"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  rupert-db:
  rupert-storage:
