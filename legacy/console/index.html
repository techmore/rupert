<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Herbal Healers — Inventory Management</title>
<style>
:root{
  --bg0:#04181f;--bg1:#05222c;--panel:#0a303d;--panel2:#082833;--card:#0c3544;
  --line:#1c4f5d;--line2:#2a6a7a;--fg:#eef7f8;--muted:#9dbcc2;--faint:#6d8a92;
  --teal:#073b4c;--bubblegum:#ef476f;--royal:#ffd166;--emerald:#06d6a0;--ocean:#118ab2;
  --ok:#06d6a0;--warn:#ffd166;--err:#ef476f;--info:#3fb6d9;
  --accent:#06d6a0;--accent-ink:#042a20;--accent2:linear-gradient(135deg,#118ab2,#06d6a0);
  --shadow:0 16px 40px rgba(2,18,25,.5);
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg0);color:var(--fg);font:14.5px/1.55 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--ocean);text-decoration:none}
svg{display:block}
:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:6px}
::selection{background:rgba(6,214,160,.25)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:radial-gradient(1200px 600px at 18% -6%,#0b3b49 0,var(--bg0) 55%)}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;gap:22px;padding:22px 16px;border-right:1px solid var(--line);background:linear-gradient(180deg,var(--bg1),var(--bg0));position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.mark{width:38px;height:38px;border-radius:11px;flex:0 0 auto;background:conic-gradient(from 210deg,#118ab2,#06d6a0,#ffd166,#118ab2);box-shadow:0 8px 22px rgba(17,138,178,.4)}
.brand .name{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.brand .sub{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.side-nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:650;font-size:13.5px;cursor:pointer;border:1px solid transparent;background:transparent;text-align:left;font:inherit}
.nav-item:hover{color:var(--fg);background:rgba(17,138,178,.1)}
.nav-item[aria-selected="true"]{color:#fff;background:linear-gradient(90deg,rgba(17,138,178,.32),rgba(6,214,160,.12));border-color:var(--line2);box-shadow:inset 3px 0 0 var(--emerald)}
.nav-item .ico{width:18px;height:18px;flex:0 0 auto;opacity:.9}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 6px 2px;color:var(--faint);font-size:11.5px;line-height:1.7}
.side-foot b{color:var(--muted)}

/* ---------- top bar ---------- */
.main{min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 26px;border-bottom:1px solid var(--line);background:rgba(5,34,44,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.pagehead h1{margin:0;font-size:20px;letter-spacing:-.02em;font-weight:800}
.crumb{margin:2px 0 0;color:var(--faint);font-size:12.5px}
.crumb b{color:var(--ocean)}
.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.health{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.chip.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chip.warn .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.chip.err .dot{background:var(--err);box-shadow:0 0 8px var(--err)}
.chip .meta strong{display:block;font-size:12px}
.chip .meta span{color:var(--faint);font-size:11px;display:block}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--fg);border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn:hover{border-color:var(--ocean)}
.btn:disabled{opacity:.5;cursor:default;pointer-events:none}
.btn.primary{background:linear-gradient(135deg,#0c9f7c,var(--emerald));border-color:transparent;color:#04281f;font-weight:850;box-shadow:0 6px 18px rgba(6,214,160,.3)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:12.5px;border-radius:8px}

/* ---------- page ---------- */
.page{padding:22px 26px 60px;max-width:1440px}
.banner{display:none;margin-bottom:16px;padding:12px 15px;border-radius:11px;font-weight:600;border:1px solid;font-size:13.5px}
.banner.show{display:block}
.banner.err{background:#3a1420;border-color:#6e2a3a;color:#ffd4d9}
.banner.ok{background:#0d2b24;border-color:#1f6b4f;color:#d6f8e9}

.section{margin-top:14px}
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.grid-2.eq{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:linear-gradient(155deg,var(--card),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.card > .label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:700;display:flex;align-items:center;gap:6px}
.card > .value{font-size:clamp(20px,2.4vw,27px);font-weight:900;margin:4px 0 1px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card > .detail{color:var(--muted);font-size:12px}
.card > h2{margin:0 0 12px;font-size:15px;letter-spacing:-.01em;font-weight:800;display:flex;align-items:center;gap:8px}
.stat.tone-bubble{border-top:2px solid var(--bubblegum)}
.stat.tone-royal{border-top:2px solid var(--royal)}
.stat.tone-ocean{border-top:2px solid var(--ocean)}
.stat.tone-emerald{border-top:2px solid var(--emerald)}
.stat.tone-teal{border-top:2px solid var(--ocean)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
table th,table td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
table tr:last-child td{border-bottom:0}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);background:var(--bg1);position:sticky;top:0;z-index:2;white-space:nowrap;font-weight:800}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--emerald)}
th.sortable .arw{opacity:.45;margin-left:3px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(17,138,178,.07)}

.pill{display:inline-block;padding:2.5px 9px;border-radius:999px;background:#10404e;font-size:11.5px;font-weight:750;line-height:1.55;white-space:nowrap}
.pill.ok{background:#0d4630;color:#b8ffe6}
.pill.warn{background:#52400e;color:#ffe9ad}
.pill.bad{background:#5a2030;color:#ffc4d0}
.pill.info{background:#16405a;color:#d0ebff}
.pill.faint{background:#17343e;color:#cfe2e8}
.pill.ocean{background:#123f55;color:#b9ecff}
.pill.dot{display:inline-flex;align-items:center;gap:6px}
.pill .pd{width:7px;height:7px;border-radius:50%}

.callout{border-left:3px solid var(--warn);padding:10px 12px;background:#3a2e0d;color:#fff2c4;margin:8px 0;border-radius:0 10px 10px 0;font-size:13px;line-height:1.5}
.callout.ok{border-color:var(--ok);background:#0c2c22;color:#cdf7e2}
.callout.err{border-color:var(--err);background:#3a1420;color:#ffd5dc}
.callout.info{border-color:var(--info);background:#0f2a3d;color:#d5ecff}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--faint);font-size:13px}

/* ---------- toolbar / search ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;min-width:220px;flex:1;max-width:360px}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint);pointer-events:none}
.search input{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:10px;padding:9px 12px 9px 34px;font:inherit;font-size:13px}
.search input:focus{border-color:var(--emerald);outline:none;box-shadow:0 0 0 3px rgba(6,214,160,.15)}
select,input[type=text]{background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px}
select:focus{border-color:var(--ocean);outline:none}
.tr-span{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12px;margin-left:auto}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap;color:var(--faint);font-size:12.5px}
.pager button{min-width:64px}

/* ---------- charts ---------- */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:12px}
.legend .sw{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:8px;height:8px;border-radius:50%}
.progress{height:8px;background:#12333d;border-radius:99px;overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.bar{height:8px;background:#12333d;border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#118ab2,#06d6a0);border-radius:99px}
.barrow{display:grid;grid-template-columns:minmax(120px,1fr) 3fr 52px;gap:10px;align-items:center;margin:9px 0;font-size:12.5px}
.barrow .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.barrow strong{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- ledger / log ---------- */
.ledger-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.log{font:12.5px/1.5 var(--mono)}
.logrow{display:grid;grid-template-columns:132px 76px 1fr;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line)}
.logrow:last-child{border-bottom:0}
.lg-level{font-weight:800;text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;align-self:center}
.lg-info{color:var(--info)}.lg-success{color:var(--ok)}.lg-error{color:var(--err)}
.lg-msg{color:var(--muted);word-break:break-word;font-family:var(--font)}
.lg-time{color:var(--faint);font-size:11.5px;white-space:nowrap}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.muted{color:var(--faint)}
.loading{border:1px dashed var(--line);border-radius:12px;padding:32px;text-align:center;color:var(--faint)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.badge .d{width:7px;height:7px;border-radius:50%}

@media(max-width:940px){
  .layout{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:14px 18px}
  .side-nav{flex-direction:row;flex-wrap:wrap;flex:1}
  .side-foot{display:none}
  .topbar{padding:14px 16px}
  .page{padding:16px 16px 50px}
  .grid-2,.grid-2.eq{grid-template-columns:1fr}
  .top-actions{width:100%}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <div class="name">Herbal Healers</div>
        <div class="sub">Inventory Management</div>
      </div>
    </div>
    <nav class="side-nav" role="tablist" id="tabs" aria-label="Sections">
      <button class="nav-item" role="tab" id="tab-overview" aria-selected="true" data-view="overview" tabindex="0">Overview</button>
      <button class="nav-item" role="tab" id="tab-inventory" aria-selected="false" data-view="inventory" tabindex="-1">Inventory</button>
      <button class="nav-item" role="tab" id="tab-wholesale" aria-selected="false" data-view="wholesale" tabindex="-1">Wholesale</button>
      <button class="nav-item" role="tab" id="tab-sales" aria-selected="false" data-view="sales" tabindex="-1">Sales</button>
      <button class="nav-item" role="tab" id="tab-ledger" aria-selected="false" data-view="ledger" tabindex="-1">Ledger</button>
      <button class="nav-item" role="tab" id="tab-sync" aria-selected="false" data-view="sync" tabindex="-1">Sync &amp; audit</button>
    </nav>
    <div class="side-foot">
      <b>PrismaSync engine</b><br>
      Shopify ⇄ Square reconciliation<br>
      Central SQLite ledger<br>
      Auto-sync every 15 min
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Overview</h1>
        <p class="crumb" id="crumb">Live operations snapshot</p>
      </div>
      <div class="top-actions">
        <div class="health" id="health" aria-live="polite">
          <div class="chip" id="chip-shopify"><span class="dot"></span><div class="meta"><strong>Shopify</strong><span>Checking…</span></div></div>
          <div class="chip" id="chip-square"><span class="dot"></span><div class="meta"><strong>Square</strong><span>Checking…</span></div></div>
          <div class="chip" id="chip-sync"><span class="dot"></span><div class="meta"><strong>Auto-sync</strong><span>Checking…</span></div></div>
        </div>
        <button class="btn primary" id="sync-btn" type="button">Sync everything</button>
      </div>
    </header>

    <div class="page">
      <div id="banner" class="banner" role="alert"></div>
      <main id="content"><section class="loading">Loading the latest verified snapshot…</section></main>
    </div>
  </div>
</div>
<script src="/console/client.js"></script>
</body>
</html>
