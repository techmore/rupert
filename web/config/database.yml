# PostgreSQL. Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER", "rupert") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "rupert") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", "5432") %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "rupert_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
# Deliberately NOT driven by POSTGRES_DB: the repo .env sets that to
# rupert_production, and tests must never run against the production database.
test:
  <<: *default
  database: rupert_test

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "rupert_production") %>
  # The well-known "rupert" default must never run in production. Set
  # POSTGRES_PASSWORD in the droplet .env or the app refuses to boot.
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { raise "POSTGRES_PASSWORD must be set in the production environment" } %>
