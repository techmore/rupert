# Release gate: the things the next release is waiting on that need an outside account or a
# professional, shown to owners and platform administrators as the gate icon in the top bar
# (shared/_header_gate). Tick an item off by changing its status to done; the badge counts the
# open ones and the icon disappears when none are left. Read at render time from this file only:
# no database, no network.
release: v0.2.1
tracker_issue: 326
items:
