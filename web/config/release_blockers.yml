    needed: Set up the payment gateway and the Apple and Google merchant accounts.
    issues: [479]
    status: open
  - id: pos_hardware
    title: POS hardware
    needed: Terminal details and a hardware plan agreed with North.
    issues: [478]
    status: open
  - id: branch_protection
