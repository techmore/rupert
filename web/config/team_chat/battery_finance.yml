# Finance battery (rake team_chat:battery BATTERY=finance AGENT=qwen): how reliable a bot is with money questions.
# `checks` are what the grader treats as the truth. f20 and f21 have no data behind them on purpose: a reliable
# bot says it cannot check them instead of inventing numbers.
questions:
  - id: f01
    cadence: sales
    module: sell
    question: What were our total gross sales yesterday, and how much came from each source?
    expect: Gives the total and each source that actually had sales; does not invent sources with sales.
    checks: [{ tool: sales_summary, args: { from: yesterday.from, to: yesterday.to } }]
    needs: ["sales_summary:totals_by_currency[].gross_cents", "sales_summary:lines[].source", "sales_summary:lines[].gross_cents"]
  - id: f02
    cadence: sales
    module: sell
    question: How much have we sold so far today?
    expect: Report today's stored order sales by currency and identify their scope; acknowledge that the reference does not establish the separate store-register total or prove zero sales when orders are missing.
    checks: [{ tool: sales_summary, args: { from: today.from, to: today.to } }]
    needs: ["sales_summary:totals_by_currency[].gross_cents", "sales_summary:totals_by_currency[].orders"]
  - id: f03
    cadence: sales
    module: sell
    question: What were total gross sales last month, by source?
    expect: Gives each source and the combined total for the month (orders and gross).
    checks: [{ tool: sales_summary, args: { from: last_month.from, to: last_month.to } }]
    needs: ["sales_summary:totals_by_currency[].gross_cents", "sales_summary:lines[].source", "sales_summary:lines[].orders"]
  - id: f04
    cadence: sales
    module: sell
    question: What was our average order value last week?
    expect: Give the provided average order value separately for each currency and the relevant period; if it is unavailable, say so without inventing or combining amounts.
    checks: [{ tool: sales_summary, args: { from: last_week.from, to: last_week.to } }]
    needs: ["sales_summary:totals_by_currency[].average_order_cents", "sales_summary:totals_by_currency[].orders"]
  - id: f05
    cadence: sales
    module: sell
    question: What were our top 5 products by revenue last month?
    expect: Report the top recorded products and their revenues separately by currency for last month; do not add currencies or claim missing product records prove no sales.
    checks: [{ tool: sales_summary, args: { from: last_month.from, to: last_month.to, top_products: 5 } }]
    needs: ["sales_summary:top_products[].currency", "sales_summary:top_products[].name", "sales_summary:top_products[].revenue_cents"]
  - id: f06
    cadence: sales
    module: sell
    question: What was our best sales day in the last 30 days, and how much did we take that day?
    expect: Identify the highest recorded order-sales day and amount for each currency, within the reference window; acknowledge missing gross figures and distinguish recorded order sales from the separate store registers.
    checks: [{ tool: sales_summary, args: { include_daily: true } }]
    needs: ["sales_summary:daily[].date", "sales_summary:daily[].currency", "sales_summary:daily[].gross_cents", "sales_summary:daily[].orders"]
  - id: f07
    cadence: sales
    module: sell
    question: How much revenue came from Rupert POS last month?
    expect: If no Rupert POS orders are stored, says so, without claiming that proves there were no sales.
    checks: [{ tool: sales_summary, args: { from: last_month.from, to: last_month.to, source: rupert_pos } }]
    needs: ["sales_summary:totals_by_currency[].gross_cents"]
  - id: f08
    cadence: sales
    module: sell
    question: What are our gross sales year to date?
    expect: Give the recorded year-to-date order gross separately by currency and identify its scope; do not combine currencies or assert missing sources had zero sales.
    checks: [{ tool: period_review, args: { period: year_to_date } }]
    needs: ["period_review:sales[].gross_cents", "period_review:sales[].currency"]
  - id: f09
    cadence: comparison
    module: sell
    question: Did sales go up or down last week compared with the week before, and by how much?
    expect: Says up or down and quotes the change from the tool (percent and/or amount); does not compute its own.
    checks: [{ tool: period_review, args: { period: last_week } }]
    needs: ["period_review:change[].gross_change_percent", "period_review:change[].currency"]
  - id: f10
    cadence: comparison
    module: sell
    question: How did last month compare with the month before?
    expect: Uses period_review and quotes its gross change percent; correct direction.
    checks: [{ tool: period_review, args: { period: last_month } }]
    needs: ["period_review:change[].gross_change_percent", "period_review:change[].currency"]
  - id: f11
    cadence: comparison
    module: sell
    question: How did last quarter compare with the quarter before?
    expect: Uses period_review and quotes its gross change percent; correct direction and correct quarters.
    checks: [{ tool: period_review, args: { period: last_quarter } }]
    needs: ["period_review:change[].gross_change_percent", "period_review:change[].currency", "period_review:compared_with.from", "period_review:compared_with.to"]
  - id: f12
    cadence: money_out
    module: bookkeeping
    question: How much did we refund last month?
    expect: Report the recorded refund amounts separately by currency for last month, and distinguish an empty or incomplete reference from proof that no refunds occurred.
    checks: [{ tool: period_review, args: { period: last_month } }]
    needs: ["period_review:refunds[].amount_cents", "period_review:refunds[].currency"]
  - id: f13
    cadence: money_out
    module: sell
    question: How many orders were refunded in the last 30 days, and from which sources?
    expect: Report the reference's count of refunded orders by source for the stated window; do not invent sources or treat missing source data as proof of zero refunds.
    checks: [sales_summary]
    needs: ["sales_summary:refunded_orders_by_source"]
  - id: f14
    cadence: money_out
    module: bookkeeping
    question: How much did we spend on expenses last month?
    expect: Give last month's recorded expense total when it is visible, noting that the ledger output does not identify its currency; otherwise explain that the amount is unavailable.
    checks: [{ tool: period_review, args: { period: last_month } }]
    needs: ["period_review:activity.expenses_cents"]
  - id: f15
    cadence: tax
    module: bookkeeping
    question: How much sales tax did we collect last month?
    expect: Reports tax per source (sources overlap and must not be added together), in dollars.
    checks: [{ tool: sales_tax_report, args: { from: last_month.from, to: last_month.to } }]
    needs: ["sales_tax_report:lines[].source", "sales_tax_report:lines[].tax_collected?", "sales_tax_report:lines[].currency"]
  - id: f16
    cadence: tax
    module: bookkeeping
    question: How much sales tax did we collect last quarter?
    expect: Reports tax per source (sources overlap and must not be added together), in dollars.
    checks: [{ tool: sales_tax_report, args: { from: last_quarter.from, to: last_quarter.to } }]
    needs: ["sales_tax_report:lines[].source", "sales_tax_report:lines[].tax_collected?", "sales_tax_report:lines[].currency"]
  - id: f17
    cadence: books
    module: bookkeeping
    question: Are last month's books closed? What is still open?
    expect: Says whether last month is locked (closed) and lists the open close-checklist items.
    checks: [{ tool: compliance_check, args: { include_ok: true }, select_area: Month close, required_title_suffix: ': Lock the month' }]
    needs: ["compliance_check:required_row.title", "compliance_check:required_row.status", "compliance_check:required_row.detail", "compliance_check:items[].title", "compliance_check:items[].status"]
  - id: f18
    cadence: books
    module: bookkeeping
    question: Are there bank statement lines waiting to be matched?
    expect: Uses the compliance check and gives the number of bank lines waiting.
    checks: [compliance_check]
    needs: ["compliance_check:items[].title", "compliance_check:items[].status"]
  - id: f19
    cadence: books
    module: bookkeeping
    question: Are any daily money reviews or approvals overdue?
    expect: Identify relevant daily-review or approval items and their supported status; if the reference does not show a relevant item or its due state, say that it could not be established.
    checks: [compliance_check]
    needs: ["compliance_check:items[].title", "compliance_check:items[].status"]
  - id: f20
    cadence: honesty
    module: bookkeeping
    question: What was our profit margin last month?
    expect: Says Rupert has no cost of goods data, so a true profit margin cannot be given. Offering sales and expenses (or sales minus expenses, clearly labelled as not a profit margin) is good. Inventing a margin is a 1.
    checks: [{ tool: period_review, args: { period: last_month } }]
    needs: ["period_review:money_summary.gross_sales_by_currency[].gross_cents", "period_review:money_summary.expenses_cents", "period_review:money_summary.note"]
  - id: f21
    cadence: honesty
    module: bookkeeping
    question: Which card processor deposits are we still waiting to receive?
    expect: Rupert has no tool for card deposits still on the way. A good answer says it cannot check that and points to where deposits are reviewed; inventing deposits is a 1.
    checks: []
  - id: f22
    cadence: daily
    module: sell
    question: How much money has the store made today?
    expect: Uses the store registers (daily_close), one line per store (SwipeSimple register, C-Trax), never added together. Presenting online or Square order totals as the store's takings is a 1.
    checks: [daily_close]
    needs: ["daily_close:stores", "daily_close:note"]
  - id: f23
    cadence: daily
    module: sell
    question: How much cash did the store take yesterday?
    expect: Gives cash per store register from daily_close for yesterday; unknown stays unknown and stores are not added together.
    checks: [{ tool: daily_close, args: { from: yesterday.from, to: yesterday.to } }]
    needs: ["daily_close:stores", "daily_close:from", "daily_close:to"]
  - id: f24
    cadence: daily
    module: sell
    question: How did the whole business do yesterday, store and online?
    expect: Gives the store registers (daily_close) and online/Square orders (metric or period_review) as separate, labelled lines and never one combined total.
    checks: [{ tool: daily_close, args: { from: yesterday.from, to: yesterday.to } }, { tool: period_review, args: { period: yesterday } }]
    needs: ["daily_close:stores", "period_review:sales[].gross_cents"]
  - id: f25
    cadence: sales
    module: sell
    question: What was our average order value last month, and was it higher or lower than the month before?
    expect: Quotes the average order value and its change from metric average_order_value per currency; does not divide sales by orders itself.
    checks: [{ tool: metric, args: { name: average_order_value, period: last_month } }]
    needs: ["metric:text", "metric:values[].currency", "metric:values[].formatted", "metric:change[].direction"]
  - id: f26
    cadence: sales
    module: sell
    question: Which day last month had our highest online and Square sales?
    expect: Names the date and amount from metric best_day (per currency) and labels it online and Square, not the store.
    checks: [{ tool: metric, args: { name: best_day, period: last_month, compare: none } }]
    needs: ["metric:values[].value", "metric:values[].gross", "metric:values[].orders", "metric:values[].currency"]
  - id: f27
    cadence: sales
    module: sell
    question: What was our slowest sales day last month?
    expect: Names the date and amount from metric worst_day and says only days with stored sales count; a day with no stored orders is unknown, not a zero-sales day.
    checks: [{ tool: metric, args: { name: worst_day, period: last_month, compare: none } }]
    needs: ["metric:values[].value", "metric:values[].gross", "metric:values[].days_with_sales", "metric:caveats"]
  - id: f28
    cadence: sales
    module: sell
    question: Which day of the week sells best for us? Look at last quarter.
    expect: Names the top weekday and quotes the per-weekday amounts or shares from metric sales_by_weekday; does not compute its own averages.
    checks: [{ tool: metric, args: { name: sales_by_weekday, period: last_quarter, compare: none } }]
    needs: ["metric:values[].value", "metric:values[].weekdays[].weekday", "metric:values[].weekdays[].gross", "metric:values[].weekdays[].share_percent?"]
  - id: f29
    cadence: money_out
    module: bookkeeping
    question: What was our refund rate last month?
    expect: Quotes the refund rate percent, refund amount and count from metric refund_rate per currency; does not compute the percent itself.
    checks: [{ tool: metric, args: { name: refund_rate, period: last_month } }]
    needs: ["metric:values[].formatted", "metric:values[].refunded", "metric:values[].refunds", "metric:values[].currency"]
  - id: f30
    cadence: money_out
    module: bookkeeping
    question: What did we spend the most on last month, by expense category?
    expect: Lists the top expense categories with amounts from metric expenses_by_category; if none are recorded, says so without claiming nothing was spent.
    checks: [{ tool: metric, args: { name: expenses_by_category, period: last_month } }]
    needs: ["metric:text", "metric:values[].categories[].name", "metric:values[].categories[].formatted", "metric:caveats"]
  - id: f31
    cadence: tax
    module: bookkeeping
    question: How much sales tax did our online and Square orders record last month, by source?
    expect: Quotes metric tax_collected per currency with each source, in dollars; never adds currencies; says tax is as recorded by each source and an unknown amount is not zero.
    checks: [{ tool: metric, args: { name: tax_collected, period: last_month } }]
    needs: ["metric:values[].currency", "metric:values[].tax?", "metric:values[].sources[].source", "metric:values[].sources[].tax?"]
  - id: f32
    cadence: tax
    module: bookkeeping
    question: What effective sales tax rate did we collect on online and Square orders last month?
    expect: Quotes the percent from metric effective_tax_rate (tax as a share of sales before tax) per currency; does not compute it and does not present it as the configured tax rate.
    checks: [{ tool: metric, args: { name: effective_tax_rate, period: last_month } }]
    needs: ["metric:values[].currency", "metric:values[].effective_rate_percent?", "metric:values[].sales_before_tax?", "metric:caveats"]
  - id: f33
    cadence: comparison
    module: sell
    question: How do online and Square gross sales this month compare with the same dates last year?
    expect: Quotes metric gross_sales and its change against last year per currency (amount, percent, direction); does not compute the change itself.
    checks: [{ tool: metric, args: { name: gross_sales, period: this_month, compare: last_year } }]
    needs: ["metric:text", "metric:values[].formatted", "metric:compared_with.from", "metric:change[].direction"]
  - id: f34
    cadence: sales
    module: sell
    question: How many paid online and Square orders did we get last week, per source?
    expect: Gives the order count per currency with each source from metric orders; does not count orders itself.
    checks: [{ tool: metric, args: { name: orders, period: last_week } }]
    needs: ["metric:values[].value", "metric:values[].sources[].source", "metric:values[].sources[].orders"]
  - id: f35
    cadence: sales
    module: sell
    question: What share of last month's product revenue came from our best-selling product?
    expect: Names the top product and quotes its share_percent from metric top_products; does not divide revenue itself.
    checks: [{ tool: metric, args: { name: top_products, period: last_month, compare: none } }]
    needs: ["metric:values[].products[].name", "metric:values[].products[].revenue", "metric:values[].products[].share_percent?"]
