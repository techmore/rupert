<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>That change was rejected — Rupert</title>
  <script>try { var t = localStorage.getItem("rupert-theme"); if (["light", "mist", "sepia", "dark"].indexOf(t) >= 0) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
  <style>
    /* Same appearances as the app (application.css): Herbal by default, or the one saved in this browser. */
    :root { color-scheme: light; --bg:#e6efea; --card:#fbfdfc; --ink:#17353a; --muted:#47605f; --line:#cddad3; --accent:#0e6f72; --accent-ink:#fbfdfc; }
    :root[data-theme="light"] { --bg:#f5f7fa; --card:#ffffff; --ink:#14181f; --muted:#5b6572; --line:#dfe4ea; --accent:#2a5fcf; --accent-ink:#ffffff; }
    :root[data-theme="mist"] { --bg:#e6ebf2; --card:#f3f6fa; --ink:#141922; --muted:#596575; --line:#cdd5e0; --accent:#2457c4; --accent-ink:#ffffff; }
    :root[data-theme="sepia"] { --bg:#efe6d4; --card:#f7f0e2; --ink:#2b2419; --muted:#665a49; --line:#d9ccb5; --accent:#185f78; --accent-ink:#f7f0e2; }
    :root[data-theme="dark"] { color-scheme: dark; --bg:#111514; --card:#1b2120; --ink:#eaf0ef; --muted:#97a5a2; --line:#2b3331; --accent:#5fa39b; --accent-ink:#111514; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",ui-sans-serif,system-ui,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    main { width:100%; max-width:30rem; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:1.5rem; padding:2.5rem 2rem; box-shadow:0 1px 2px rgba(26,57,61,.06); }
    img { width:72px; height:72px; border-radius:50%; }
    h1 { margin:1.25rem 0 .5rem; font-family:"New York",ui-serif,"Iowan Old Style","Cardo",Georgia,serif; font-weight:400; font-size:2rem; line-height:1.15; letter-spacing:-.01em; text-wrap:balance; }
    p { margin:0 auto 1.75rem; max-width:24rem; color:var(--muted); line-height:1.55; text-wrap:pretty; }
    a.btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 1.4rem; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-weight:500; text-decoration:none; transition:transform .12s ease, background-color .18s ease; }
    a.btn:active { transform:scale(.97); }
    a.btn:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    @media (prefers-reduced-motion: reduce) { a.btn { transition:none; } }
  </style>
</head>
<body>
  <main>
    <img src="/branding/rupert-80.png" alt="" width="72" height="72">
    <h1>That didn&rsquo;t go through</h1>
    <p>The change was rejected, usually because the page was open for a while. Go back, refresh, and try again.</p>
    <a class="btn" href="/">Back to the dashboard</a>
  </main>
</body>
</html>
